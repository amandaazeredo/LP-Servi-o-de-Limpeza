<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpeza NIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <!-- Logo e nome -->
            <div class="logo-area">
            <img src="Imagens/logo_solo.jpg" alt="Logo Limpeza NIT" class="logo-img">
            <span class="logo-text">Limpeza NIT</span>    
            </div>

            <!-- Menu principal -->
            <ul class="nav-menu" id="navMenu">
                <li>Sobre Nós</li>
                <li>Trabalhe Conosco</li>
                <li>Agendamentos</li>
                <li>Contatos</li>
            </ul>

            <!-- Icone Telefone -->
            <div class="phone-area">
                <img src="Imagens/icone_tel.png" alt="Telefone" class="phone-icon">
                <span class="phone-number">+21 99318-0404</span>
            </div>

            <!-- Botão Orçamento -->
            <button class="btn-orcamento">Orçamento Gratuito</button>
        </div>
    </header>

  
    <script src="script.js"></script>
</body>
</html>
